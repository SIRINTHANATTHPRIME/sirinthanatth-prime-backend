# ==============================================================================
# 🚀 SIRINTHANATTH PRIME - Supreme CI/CD Pipeline (Google Cloud Build)
# ==============================================================================
steps:
  # ----------------------------------------------------------------------------
  # 1. 🧠 Smart Cache: ดึง Image จาก Artifact Registry เพื่อเร่งความเร็ว Build
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent:latest || exit 0']

  # ----------------------------------------------------------------------------
  # 2. 🏗️ Build: สร้าง Image ด้วย Multi-Stage Dockerfile และระบบ Cache อัจฉริยะ
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent:$COMMIT_SHA'
      - '-t'
      - 'asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent:latest'
      - '--cache-from'
      - 'asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # 3. ☁️ Push: ดัน Image ขึ้น Artifact Registry (มาตรฐานความปลอดภัยสูงสุด)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent', '--all-tags']

  # ----------------------------------------------------------------------------
  # 4. 🚀 Deploy: อัปเดตเซิร์ฟเวอร์ Google Cloud Run อัตโนมัติ (Zero-Downtime)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'prime-core-agent'
      - '--image'
      - 'asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--cpu-boost'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--set-env-vars=ENVIRONMENT=production'
      - '--update-labels=ci-tool=cloudbuild,commit-sha=$COMMIT_SHA'
      
# แจ้งเตือนระบบให้รู้จัก Image ที่สร้างขึ้นบน Artifact Registry
images:
  - 'asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent:$COMMIT_SHA'
  - 'asia-southeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prime-core-agent:latest'

# 🚀 บังคับเก็บ Log ลง Cloud Logging แบบเต็มรูปแบบ พร้อมเปิดใช้งานตัวแปรไดนามิก
options:
  logging: CLOUD_LOGGING_ONLY
dynamic_substitutions: true