<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRINTHANATTH PRIME | Executive Agent KYC</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* (ใส่ CSS เดิมของคุณที่นี่ทั้งหมดได้เลยครับ เพื่อความสวยงาม) */
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Prompt', sans-serif; background-color: #020202; color: #ffffff; }
        .page-bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('assets/1000097983.png'); background-size: cover; background-position: center; opacity: 0.18; z-index: -2; pointer-events: none; filter: brightness(0.3) contrast(1.4); }
        .agent-hero { padding: 40px 20px; text-align: center; }
        .agent-container { max-width: 1200px; margin: 0 auto; padding: 20px; width: 100%; }
        .main-title { font-size: clamp(1.8rem, 4.5vw, 3.5rem); text-align: center; font-weight: 800; color: #ffffff; }
        .gold-text { color: #FFD700; }
        .agent-form-box { background: rgba(12, 12, 15, 0.95); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 20px; padding: 40px 30px; max-width: 700px; margin: 60px auto; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .form-input { width: 100%; padding: 12px 20px; margin: 10px 0 20px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-family: 'Prompt', sans-serif; }
        .btn-gold { background: linear-gradient(135deg, #FFE84D 0%, #FFD700 50%, #C59B1B 100%); color: #020202; padding: 15px; width: 100%; font-weight: 800; border-radius: 8px; cursor: pointer; border: none; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="page-bg-overlay"></div>

    <div class="agent-hero">
        <h1 class="main-title">ระบบลงทะเบียนพาร์ทเนอร์<br><span class="gold-text">EXECUTIVE AGENT (KYC)</span></h1>
        <p style="color: #aaa; margin-top: 10px;">โปรดยืนยันตัวตน (KYC) เพื่อเปิดใช้งานระบบแดชบอร์ดตามกฎหมาย</p>
    </div>

    <div class="agent-container">
        <div class="agent-form-box">
            <h2 style="color: #FFD700; margin-bottom: 20px; text-align: center;">ฟอร์มยืนยันตัวตน (KYC)</h2>
            <form id="agentForm" onsubmit="handleAgentSubmit(event)">
                
                <label style="font-weight: 600; font-size: 0.9rem;">ชื่อ - นามสกุล (ตรงตามบัตรประชาชน)</label>
                <input type="text" id="agentName" class="form-input" placeholder="ระบุชื่อจริง นามสกุลจริง" required>

                <label style="font-weight: 600; font-size: 0.9rem;">ชื่อร้านค้า / บริษัท (Shop Name)</label>
                <input type="text" id="shopName" class="form-input" placeholder="เช่น Marketing Spark Combine" required>

                <label style="font-weight: 600; font-size: 0.9rem;">เลขบัตรประชาชน / ทะเบียนนิติบุคคล (KYC ID)</label>
                <input type="text" id="kycDocId" class="form-input" placeholder="กรอกเลข 13 หลัก" required>

                <label style="font-weight: 600; font-size: 0.9rem;">ประเภทสินค้าที่จำหน่าย</label>
                <input type="text" id="productType" class="form-input" placeholder="เช่น เครื่องสำอาง, อาหารเสริม (ห้ามสินค้าผิดกฎหมาย)" required>

                <div style="margin: 15px 0; display: flex; align-items: flex-start; gap: 10px;">
                    <input type="checkbox" id="acceptCheck" style="margin-top: 4px; width: 18px; height: 18px; cursor: pointer;" required>
                    <label for="acceptCheck" style="font-size: 0.83rem; color: #eee; cursor: pointer; line-height: 1.4;">
                        ข้าพเจ้ายอมรับการเก็บข้อมูล (PDPA), กฎการหักเงิน Smart Wallet อัตโนมัติ, และเงื่อนไขการจัดส่ง Flash Express (น้ำหนักไม่เกิน 1 กก.)
                    </label>
                </div>

                <button type="submit" id="submitBtn" class="btn-gold">ยืนยันการสมัคร KYC</button>
            </form>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        async function handleAgentSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "กำลังตรวจสอบและซิงค์ข้อมูล...";
            btn.disabled = true;

            // จัดเรียงข้อมูลให้ตรงกับไฟล์ services/models.py เป๊ะๆ
            const payload = {
                name: document.getElementById('agentName').value,
                shop_name: document.getElementById('shopName').value,
                kyc_document_id: document.getElementById('kycDocId').value,
                product_type: document.getElementById('productType').value,
                accepted_terms_and_conditions: document.getElementById('acceptCheck').checked,
                selected_package: "PRIME", // ค่าเริ่มต้น
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch("/api/register_agent", { // เปลี่ยนเป็น URL ของระบบเวลาเอาขึ้น Cloud จริง
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if(response.ok) {
                    alert('✅ ยืนยัน KYC สำเร็จ! ข้อมูลถูกบันทึกลงระบบ PDPA ของ SIRINTHANATTH PRIME เรียบร้อยแล้ว');
                    document.getElementById('agentForm').reset();
                } else {
                    alert('❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                }
            } catch (error) {
                alert('โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');
            } finally {
                btn.innerHTML = "ยืนยันการสมัคร KYC";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
